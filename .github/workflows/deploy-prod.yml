name: Deploy to GCP Cloud Run (Prod)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: project-bcdbc10f-15a5-46b6-bb3
  REGION: asia-northeast3
  SERVICE_NAME: bangawo-server
  REPOSITORY: bangawo
  IMAGE: bangawo-server
  WIF_PROVIDER: projects/707796053034/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: bangawo-github-actions@project-bcdbc10f-15a5-46b6-bb3.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --port=8080 \
            --add-cloudsql-instances=project-bcdbc10f-15a5-46b6-bb3:asia-northeast3:bangawo-prod \
            --set-env-vars=SPRING_PROFILES_ACTIVE=prod,DB_HOST=/cloudsql/project-bcdbc10f-15a5-46b6-bb3:asia-northeast3:bangawo-prod,DB_PORT=5432,DB_NAME=bangawo_prod,DB_USERNAME=bangawo_user \
            --set-env-vars=JWT_SECRET_KEY=${{ secrets.PROD_JWT_SECRET_KEY }},KAKAO_REST_API_KEY=${{ secrets.PROD_KAKAO_REST_API_KEY }},DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} \
            --project=${{ env.PROJECT_ID }}
