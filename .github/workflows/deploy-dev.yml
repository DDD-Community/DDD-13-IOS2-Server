name: Deploy to Cloudtype (Dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect deploy key
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          ghtoken: ${{ secrets.GHP_TOKEN }}
          scope: tldldh1212

      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: tldldh1212/ddd-dev-server
          stage: main
          yaml: |
            name: bangawo-server-dev
            app: java@17
            options:
              ports: 8080
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: dev
                - name: JWT_SECRET_KEY
                  value: ${{ secrets.DEV_JWT_SECRET_KEY }}
                - name: KAKAO_REST_API_KEY
                  value: ${{ secrets.DEV_KAKAO_REST_API_KEY }}
                - name: DB_HOST
                  value: ${{ secrets.DEV_DB_HOST }}
                - name: DB_PORT
                  value: ${{ secrets.DEV_DB_PORT }}
                - name: DB_NAME
                  value: ${{ secrets.DEV_DB_NAME }}
                - name: DB_USERNAME
                  value: ${{ secrets.DEV_DB_USERNAME }}
                - name: DB_PASSWORD
                  value: ${{ secrets.DEV_DB_PASSWORD }}
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
