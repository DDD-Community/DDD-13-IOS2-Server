spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bangawo}
    username: ${DB_USERNAME:bangawo}
    password: ${DB_PASSWORD:bangawo}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
